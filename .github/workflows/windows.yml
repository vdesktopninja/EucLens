name: Windows build and portable publish
on:
  push:
    branches: [main, 'feature/**', 'release/**', 'cez/**']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_portable:
        description: 'Upload the portable EXE as a release-candidate artifact (kept 3 days)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
      - name: Verify SDK on PATH
        run: dotnet --info
      - name: Validate WPF design contract
        run: python tools/ux-contract.py --check
      - name: Restore
        run: dotnet restore EucLens.sln
      - name: Build
        run: dotnet build EucLens.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/EucLens.Tests/EucLens.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish portable EXE
        run: dotnet publish src/EucLens.App/EucLens.App.csproj -p:PublishProfile=Portable -o artifacts/win-x64
      - name: Verify the executable carries the EUC Lens icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path artifacts/win-x64/EucLens.exe))
          if ($null -eq $icon) { throw 'EucLens.exe has no icon' }
          $bitmap = $icon.ToBitmap()
          $blue = 0; $white = 0; $cyan = 0
          for ($y = 0; $y -lt $bitmap.Height; $y++) { for ($x = 0; $x -lt $bitmap.Width; $x++) {
            $p = $bitmap.GetPixel($x, $y)
            if ($p.A -eq 255 -and $p.B -gt 130 -and $p.R -lt 60) { $blue++ }
            if ($p.A -eq 255 -and $p.R -gt 235 -and $p.G -gt 235 -and $p.B -gt 235) { $white++ }
            if ($p.A -eq 255 -and $p.R -lt 90 -and $p.G -gt 170 -and $p.B -gt 210) { $cyan++ }
          } }
          "Executable icon $($icon.Width)x$($icon.Height): blue $blue, white $white, cyan $cyan pixels"
          if ($blue -lt 100 -or $white -lt 20 -or $cyan -lt 5) { throw 'The executable icon is not the EUC Lens icon' }
          New-Item -ItemType Directory -Force artifacts/win-x64/visual-evidence | Out-Null
          $bitmap.Save((Join-Path (Resolve-Path artifacts/win-x64/visual-evidence) 'exe-icon-pipeline.png'), [System.Drawing.Imaging.ImageFormat]::Png)
      - name: Verify the executable version, size and SHA-256
        shell: pwsh
        run: |
          $expected = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $exe = Get-Item artifacts/win-x64/EucLens.exe
          $info = $exe.VersionInfo
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force artifacts/win-x64/visual-evidence | Out-Null
          $report = @(
            "Expected version (Directory.Build.props): $expected"
            "FileVersion: $($info.FileVersion)"
            "ProductVersion: $($info.ProductVersion)"
            "Size: $($exe.Length) bytes"
            "SHA-256: $hash"
          )
          $report | Set-Content artifacts/win-x64/visual-evidence/exe-version.txt
          $report
          if (-not $expected) { throw 'Directory.Build.props has no Version' }
          if ($info.FileVersion -ne "$expected.0") { throw "FileVersion $($info.FileVersion) does not match $expected" }
          if (-not $info.ProductVersion.StartsWith($expected)) { throw "ProductVersion $($info.ProductVersion) does not match $expected" }
      - name: Verify single EXE and run Windows smoke test
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'EucLens.exe') {
            throw 'Portable publish must contain exactly EucLens.exe'
          }
          $app = Start-Process artifacts/win-x64/EucLens.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(900000)) {
            $app.Kill()
            throw 'WPF smoke test timed out'
          }
          $app.Refresh()
          # Every result is printed and every check is made before the step fails, so one failure never hides the evidence of the others.
          $problems = @()
          if (Test-Path artifacts/win-x64/smoke-result.txt) {
            Get-Content artifacts/win-x64/smoke-result.txt
          }
          if ($app.ExitCode -ne 0) { $problems += "WPF smoke test failed ($($app.ExitCode))" }
          if (Test-Path artifacts/win-x64/visual-evidence/background-validation.txt) {
            Get-Content artifacts/win-x64/visual-evidence/background-validation.txt
          }
          if (-not (Test-Path artifacts/win-x64/smoke-result.txt)) { $problems += 'Missing smoke result' }
          if (Test-Path artifacts/win-x64/visual-evidence/background-validation.txt) {
            $exitCheck = Get-Content artifacts/win-x64/visual-evidence/background-validation.txt -Raw
            if ($exitCheck -notmatch 'PASS: Exit finalized the running recording') { $problems += 'Exit did not finalize the recording' }
            if ($exitCheck -match 'FAIL:') { $problems += 'Background validation reported a failure' }
          } else { $problems += 'Missing background validation result' }
          if (Test-Path artifacts/win-x64/visual-evidence/history-validation.txt) {
            Get-Content artifacts/win-x64/visual-evidence/history-validation.txt
          }
          foreach ($result in 'history-events-result.txt', 'history-navigation-result.txt', 'history-6h-result.txt') {
            if (Test-Path "artifacts/win-x64/visual-evidence/$result") { Get-Content "artifacts/win-x64/visual-evidence/$result" }
          }
          if (-not (Test-Path artifacts/win-x64/visual-evidence/history-validation.txt)) { $problems += 'Missing history validation result' }
          else {
            $historyCheck = Get-Content artifacts/win-x64/visual-evidence/history-validation.txt -Raw
            if ($historyCheck -notmatch 'PASS: history validation complete') { $problems += 'History validation did not complete' }
            if ($historyCheck -match 'FAIL:') { $problems += 'History validation reported a failure' }
          }
          if ((Test-Path artifacts/win-x64/smoke-result.txt) -and -not ((Get-Content artifacts/win-x64/smoke-result.txt -Raw).StartsWith('PASS:'))) {
            $problems += 'WPF smoke result did not pass'
          }
          if ($problems.Count -gt 0) { throw ('Windows validation failed: ' + ($problems -join '; ')) }
      # The smoke test above drives the published EXE with --smoke-test. This step starts it the way a person does (no arguments)
      # from a copy in a folder of its own, and checks that the main window appears, answers and the process stays alive.
      - name: Launch the published EXE as a user would
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'launch-check'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item artifacts/win-x64/EucLens.exe $dir
          $app = Start-Process (Join-Path $dir 'EucLens.exe') -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
              $app.Refresh()
              if ($app.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($app.HasExited) { throw "EucLens.exe exited at start with code $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'No main window appeared within 60 seconds' }
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "EucLens.exe exited by itself with code $($app.ExitCode)" }
            if (-not $app.Responding) { throw 'The main window does not respond' }
            if ($app.MainWindowTitle -notlike '*EUC Lens*') { throw "Unexpected window title '$($app.MainWindowTitle)'" }
            "PASS: launched $((Get-Item (Join-Path $dir 'EucLens.exe')).Length) bytes, window '$($app.MainWindowTitle)', responding, alive after 8 s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            if (-not $app.HasExited) { $null = $app.CloseMainWindow(); if (-not $app.WaitForExit(10000)) { $app.Kill() } }
          }
      - name: Verify the executable embeds no API key or credential
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes((Resolve-Path artifacts/win-x64/EucLens.exe)))
          $hits = [regex]::Matches($text, 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|Bearer [A-Za-z0-9._-]{20,}')
          if ($hits.Count -gt 0) { throw "Credential-like strings in the executable: $($hits.Count)" }
          'PASS: no credential-like strings in EucLens.exe' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Summarize test and smoke results in the job log
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          # The durable record of a run is this log: validation-results expires after 1 day.
          $ErrorActionPreference = 'Continue'
          $summary = @()
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            $summary += 'Tests: no result file was produced (the build or the test step did not finish)'
          } else {
            $run = [xml](Get-Content $trx.FullName)
            $c = $run.TestRun.ResultSummary.Counters
            $summary += "Tests: total $($c.total), passed $($c.passed), failed $($c.failed), not executed $($c.notExecuted)"
            $failed = @($run.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
            foreach ($f in $failed) {
              "::error title=Test failed::$($f.testName)"
              Write-Host "::group::Failed: $($f.testName)"
              $message = "$($f.Output.ErrorInfo.Message)"
              $stack = "$($f.Output.ErrorInfo.StackTrace)"
              if ($message.Length -gt 3000) { $message = $message.Substring(0, 3000) + ' ...' }
              if ($stack.Length -gt 3000) { $stack = $stack.Substring(0, 3000) + ' ...' }
              $message
              $stack
              Write-Host '::endgroup::'
            }
          }
          $summary
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Host '::group::Files produced by the smoke test'
          if (Test-Path artifacts/win-x64) {
            Get-ChildItem artifacts/win-x64 -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, (Resolve-Path -Relative $_.FullName) }
          } else { 'artifacts/win-x64 does not exist' }
          Write-Host '::endgroup::'
          if ($env:JOB_STATUS -ne 'success') {
            if (Test-Path artifacts/win-x64/smoke-progress.txt) {
              Write-Host '::group::smoke-progress.txt (last 80 lines)'
              Get-Content artifacts/win-x64/smoke-progress.txt -Tail 80
              Write-Host '::endgroup::'
            }
            foreach ($result in 'smoke-result.txt', 'visual-evidence/background-validation.txt', 'visual-evidence/history-validation.txt') {
              $file = Join-Path artifacts/win-x64 $result
              if (Test-Path $file) {
                Write-Host "::group::$result"
                Get-Content $file
                Write-Host '::endgroup::'
              }
            }
          }
      # Artifact storage is exhausted, so uploaded evidence cannot be relied on. The Dashboard, Diagnostics and Settings screenshots (100 %, both themes) and any failure picture
      # are therefore also written into this job's log as compressed pictures (JPEG, quality 85) that tools/ci-log-images.py turns back into files. Additive: it checks
      # nothing and removes nothing; a failure here never fails the build.
      - name: Print the page screenshots into the job log
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = @(Get-ChildItem 'artifacts/win-x64/visual-evidence/*' -Include '*-100pct-*-DashboardPage.png', '*-100pct-*-DiagnosticsPage.png', '*-100pct-*-SettingsPage.png', 'FAILED-*.png' -ErrorAction SilentlyContinue | Sort-Object Name)
          # The Session History workspace: every scenario in both themes at 100 % and, at the narrowest size, with the space of 150 % (simulated space, not a Windows DPI change).
          $files += @(Get-ChildItem 'artifacts/win-x64/visual-evidence/workspace/*.png' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*-100pct.png' -or $_.Name -like '*-1366x768-150pct.png' } | Sort-Object Name)
          Write-Host "Page screenshots: $($files.Count)"
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $parameters = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $parameters.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]78)
          foreach ($file in $files) {
            $image = [System.Drawing.Image]::FromFile($file.FullName)
            $stream = New-Object System.IO.MemoryStream
            $image.Save($stream, $codec, $parameters)
            $width = $image.Width; $height = $image.Height
            $image.Dispose()
            $text = [Convert]::ToBase64String($stream.ToArray())
            Write-Host "::group::SCREENSHOT $($file.BaseName).jpg ${width}x${height} ($($stream.Length) bytes)"
            for ($i = 0; $i -lt $text.Length; $i += 4000) { Write-Host ('IMG ' + $text.Substring($i, [Math]::Min(4000, $text.Length - $i))) }
            Write-Host '::endgroup::'
          }
      - name: Upload test and smoke evidence
        id: upload_evidence
        if: always()
        # Routine evidence is a convenience; the job log above is the record. If the account's artifact storage is exhausted this upload fails,
        # and that must not turn a passing validation red. The portable EXE upload below deliberately has no such exception.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          path: |
            TestResults/*.trx
            artifacts/win-x64/smoke-result.txt
            artifacts/win-x64/smoke-progress.txt
            artifacts/win-x64/visual-evidence/
          retention-days: 1
          if-no-files-found: warn
      - name: Report a failed evidence upload
        if: always() && steps.upload_evidence.outcome == 'failure'
        shell: pwsh
        run: |
          '::warning title=validation-results was not uploaded::Check the account''s Actions artifact storage. The results of this run are in the log of this job.'
      - name: Prepare release-candidate checksum
        if: github.event_name == 'workflow_dispatch' && inputs.upload_portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/candidate | Out-Null
          Copy-Item artifacts/win-x64/EucLens.exe artifacts/candidate/EucLens.exe
          $hash = (Get-FileHash artifacts/candidate/EucLens.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EucLens.exe" | Set-Content -Encoding ascii artifacts/candidate/EucLens.exe.sha256
          "Release candidate $env:GITHUB_SHA: SHA-256 $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      # The portable EXE is about 86 MB per upload. It is uploaded only when a person dispatches the workflow, and only after every step above passed.
      - name: Upload portable application (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: EucLens-win-x64
          path: |
            artifacts/candidate/EucLens.exe
            artifacts/candidate/EucLens.exe.sha256
          retention-days: 3
          if-no-files-found: error
